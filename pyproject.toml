[project]
name = "yeet"
version = "0.1.0"
description = "CLI tool to reclaim disk space by finding and deleting stale projects, large files, and system caches"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "sohanmanju", email = "sohanmanju@users.noreply.github.com" }
]
keywords = [
    "cli",
    "disk-space",
    "cleanup",
    "cache",
    "storage",
    "macos",
    "linux",
    "windows",
    "developer-tools",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Filesystems",
    "Topic :: Utilities",
]
dependencies = [
    "rich>=14.0.0",
    "prompt-toolkit>=3.0.0",
]

[project.urls]
Homepage = "https://github.com/sohanmanju/yeet"
Repository = "https://github.com/sohanmanju/yeet"
Issues = "https://github.com/sohanmanju/yeet/issues"

[project.scripts]
yeet = "yeet.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["yeet"]

[tool.uv]
package = true
